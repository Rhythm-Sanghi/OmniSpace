<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni-Space — Offline</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      max-width: 360px;
      margin: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      color: #f8fafc;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    button {
      background: #9333ea;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #7e22ce;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌌</div>
    <h1>You are offline</h1>
    <p>Omni-Space requires a local Wi-Fi or signaling connection to pair with your other devices.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
