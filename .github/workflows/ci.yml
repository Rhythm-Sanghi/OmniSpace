name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --quiet

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite with Coverage
        run: npm run test:coverage

      - name: Build All Workspaces
        run: npm run build:all

  rust-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev libxtst-dev libudev-dev pkg-config libsoup2.4-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Ensure desktop dist directory exists
        run: |
          mkdir -p desktop/dist
          echo '<!DOCTYPE html><html><head><title>OmniSpace</title></head><body><div id="root"></div></body></html>' > desktop/dist/index.html

      - name: Check Rust Code
        run: |
          cargo check --manifest-path desktop/src-tauri/Cargo.toml --verbose 2>&1 | tee cargo-check.log || {
            head -n 40 cargo-check.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Run Clippy
        run: |
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings 2>&1 | tee cargo-clippy.log || {
            head -n 40 cargo-clippy.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

