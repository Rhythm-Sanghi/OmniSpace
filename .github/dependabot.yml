version: 2
updates:
  # Maintain dependencies for npm monorepo
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      lint-and-test:
        patterns:
          - "eslint*"
          - "typescript*"
          - "vitest*"
          - "prettier*"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
